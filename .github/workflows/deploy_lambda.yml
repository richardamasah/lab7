name: Deploy Both Lambdas to AWS1

on:
  push:
    branches:
      - lab7
    
      

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 📦 Zip processor Lambda
        run: |
          zip -j processor.zip lambda/processor_handler.py

      - name: 🚀 Deploy processor Lambda
        uses: aws-actions/aws-cli-action@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
          inlineScript: |
            aws lambda update-function-code \
              --function-name handle_trip_events_lambda \
              --zip-file fileb://processor.zip

      - name: 📦 Zip KPI Lambda
        run: |
          zip -j kpi.zip lambda/kpi_handler.py

      - name: 🚀 Deploy KPI Lambda
        uses: aws-actions/aws-cli-action@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
          inlineScript: |
            aws lambda update-function-code \
              --function-name generate_kpis_lambda \
              --zip-file fileb://kpi.zip
